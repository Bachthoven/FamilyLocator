name: Mobile Release

on:
  push:
    tags:
      - "mobile-v*"
      - "ios-v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        default: "all"
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: "Build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_ios: ${{ steps.platforms.outputs.ios }}
      build_android: ${{ steps.platforms.outputs.android }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#mobile-v}"
            VERSION="${VERSION#ios-v}"
            VERSION="${VERSION#android-v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine platforms
        id: platforms
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          REF="${{ github.ref_name }}"

          if [[ "$REF" == ios-v* ]]; then
            echo "ios=true" >> $GITHUB_OUTPUT
            echo "android=false" >> $GITHUB_OUTPUT
          elif [[ "$REF" == android-v* ]]; then
            echo "ios=false" >> $GITHUB_OUTPUT
            echo "android=true" >> $GITHUB_OUTPUT
          else
            if [[ "$PLATFORM" == "ios" ]]; then
              echo "ios=true" >> $GITHUB_OUTPUT
              echo "android=false" >> $GITHUB_OUTPUT
            elif [[ "$PLATFORM" == "android" ]]; then
              echo "ios=false" >> $GITHUB_OUTPUT
              echo "android=true" >> $GITHUB_OUTPUT
            else
              echo "ios=true" >> $GITHUB_OUTPUT
              echo "android=true" >> $GITHUB_OUTPUT
            fi
          fi

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: prepare
    if: needs.prepare.outputs.build_ios == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run mobile tests
        run: |
          echo "Running mobile-specific tests..."
          npx vitest run --grep "mobile" --passWithNoTests

      - name: Build iOS app
        run: |
          cd mobile
          eas build --platform ios --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload to TestFlight
        if: github.event.inputs.profile == 'production' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Uploading to TestFlight..."
          # EAS handles this automatically with submit command
          # eas submit --platform ios --latest

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.build_android == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Run mobile tests
        run: |
          echo "Running mobile-specific tests..."
          npx vitest run --grep "mobile" --passWithNoTests

      - name: Build Android app
        run: |
          cd mobile
          eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload to Play Store Internal Testing
        if: github.event.inputs.profile == 'production' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Uploading to Play Store Internal Testing..."
          # EAS handles this automatically with submit command
          # eas submit --platform android --latest

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-ios, build-android]
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "## Mobile Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS Build: ${{ needs.build-ios.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Android Build: ${{ needs.build-android.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
