name: Dependency Review

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          echo "Checking dependency licenses..."
          npx license-checker --summary --production || true

      - name: Check for problematic licenses
        run: |
          # Check for GPL or other restrictive licenses in production deps
          PROBLEMATIC=$(npx license-checker --production --json 2>/dev/null | \
            jq -r 'to_entries[] | select(.value.licenses | test("GPL|AGPL"; "i")) | .key' || true)
          if [ -n "$PROBLEMATIC" ]; then
            echo "::warning::Potentially problematic licenses found: $PROBLEMATIC"
          else
            echo "No problematic licenses detected"
          fi

  sdk-security-check:
    name: SDK Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check location/map SDK versions
        run: |
          echo "Checking map and location SDK versions..."
          cat package.json | jq '.dependencies | to_entries[] | select(.key | test("map|location|expo-location"; "i"))' || true

      - name: Check push notification SDK
        run: |
          echo "Checking push notification SDK..."
          cat package.json | jq '.dependencies | to_entries[] | select(.key | test("notify|notification|push"; "i"))' || true

      - name: Verify SDK authenticity
        run: |
          echo "Verifying SDK package integrity..."
          npm ls native-notify 2>/dev/null || true
          npm ls expo-notifications 2>/dev/null || true
